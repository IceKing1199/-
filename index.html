<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Brawl Stars Clone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      touch-action: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    body {
      background: #0d0d1a;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      color: white;
      user-select: none;
    }
    #gameCanvas {
      display: block;
      background: #7ec850;
      cursor: crosshair;
      max-width: 100vw;
      max-height: 100vh;
      touch-action: none;
    }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ============================================================
// BRAWL STARS CLONE — Showdown Edition
// Tile-based map (walls / boxes / bushes / water), bush stealth,
// HP regen, power cubes, shrinking poison cloud, destructible
// walls, Web Audio sound, smarter bots, reworked brawlers.
// Mobile: twin virtual joysticks + dedicated super stick.
// ============================================================

const TILE      = 80;
const MAP_COLS  = 30;
const MAP_ROWS  = 23;
const ARENA_WIDTH  = MAP_COLS * TILE;   // 2400
const ARENA_HEIGHT = MAP_ROWS * TILE;   // 1840
const CANVAS_WIDTH  = 800;
const CANVAS_HEIGHT = 600;
const MATCH_DURATION = 180;             // fail-safe; matches end by elimination
const TOTAL_PLAYERS = 8;                // 1 player + 7 bots
const TAU = Math.PI * 2;

// Tile types
const T_EMPTY=0, T_WALL=1, T_BOX=2, T_CRATE=3, T_BUSH=4, T_WATER=5;
const BOX_HP = 2400, CRATE_HP = 3600;

let game = null; // global singleton, set on load

const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

const GameState = { MENU: 'menu', PLAYING: 'playing', GAME_OVER: 'gameOver' };

// ── BRAWLER CONFIGS ──────────────────────────────────────────
const BRAWLER_CONFIGS = {
  shelly: {
    name: 'Shelly', hp: 3600, speed: 2.8, damage: 320, range: 240,
    reload: 90, attackCooldown: 25, bulletSpeed: 7, bulletCount: 5, spread: 0.45,
    falloff: true,
    radius: 18, color: '#ff69b4', symbol: 'S',
    superDamage: 400, superSpread: 0.7, superBullets: 9, superChargeRate: 0.15
  },
  colt: {
    name: 'Colt', hp: 2800, speed: 3.1, damage: 280, range: 320,
    reload: 85, attackCooldown: 30, bulletSpeed: 10, bulletCount: 4, spread: 0,
    radius: 16, color: '#4169e1', symbol: 'C',
    superDamage: 320, superBurstCount: 12, superChargeRate: 0.12
  },
  bull: {
    name: 'Bull', hp: 5000, speed: 2.7, damage: 450, range: 170,
    reload: 100, attackCooldown: 30, bulletSpeed: 6, bulletCount: 3, spread: 0.35,
    falloff: true,
    radius: 22, color: '#8b0000', symbol: 'B',
    superDamage: 900, superChargeRate: 0.18,
    chargeSpeed: 12, chargeDuration: 30
  },
  nita: {
    name: 'Nita', hp: 3800, speed: 2.9, damage: 660, range: 260,
    reload: 80, attackCooldown: 25, bulletSpeed: 7, bulletCount: 1, spread: 0,
    radius: 17, color: '#8b4513', symbol: 'N',
    superDamage: 0, superChargeRate: 0.16,
    bearHp: 4200, bearDamage: 480, bearSpeed: 2.4,
    bearRadius: 20, bearDuration: 900
  }
};

// ── TILE MAP (Showdown-style, 180° symmetric) ────────────────
// .=empty  X=rock wall  B=box  C=power-cube crate  b=bush
// W=water (blocks movement, bullets fly over)  S=spawn point
const MAP_ASCII = [
"..............................",
".S......bb....S.....bb......S.",
"........bb..XX..XX..bb........",
"...BB.......X....X.......BB...",
"...BB...C................C....",
"..........bbb....bbb..........",
".WW.......bbb....bbb.......WW.",
".WW...X......BBBB......X...WW.",
"......X.......BB.......X......",
".S....X................X......",
"............bbbbbb............",
".....C.....bb.CC.bb.....C.....",
"............bbbbbb............",
"......X................X....S.",
"......X.......BB.......X......",
".WW...X......BBBB......X...WW.",
".WW.......bbb....bbb.......WW.",
"..........bbb....bbb..........",
"....C................C...BB...",
"...BB.......X....X.......BB...",
"........bb..XX..XX..bb........",
".S......bb.....S....bb......S.",
"..............................",
];

function buildTileMap() {
  if (MAP_ASCII.length !== MAP_ROWS)
    throw new Error(`MAP_ASCII has ${MAP_ASCII.length} rows, expected ${MAP_ROWS}`);
  const grid = new Uint8Array(MAP_COLS*MAP_ROWS);
  const boxHp = new Float32Array(MAP_COLS*MAP_ROWS);
  const spawnPoints = [];
  const CHAR_TILE = {'.':T_EMPTY,'S':T_EMPTY,'X':T_WALL,'B':T_BOX,'C':T_CRATE,'b':T_BUSH,'W':T_WATER};
  for (let ty=0; ty<MAP_ROWS; ty++) {
    const row = MAP_ASCII[ty];
    if (row.length !== MAP_COLS)
      throw new Error(`MAP_ASCII row ${ty} has ${row.length} cols, expected ${MAP_COLS}`);
    for (let tx=0; tx<MAP_COLS; tx++) {
      const ch = row[tx], t = CHAR_TILE[ch];
      if (t === undefined) throw new Error(`MAP_ASCII bad char '${ch}' at ${tx},${ty}`);
      const i = ty*MAP_COLS+tx;
      grid[i] = t;
      if (t === T_BOX)   boxHp[i] = BOX_HP;
      if (t === T_CRATE) boxHp[i] = CRATE_HP;
      if (ch === 'S') spawnPoints.push({ x:(tx+0.5)*TILE, y:(ty+0.5)*TILE });
    }
  }
  return {
    grid, boxHp, spawnPoints,
    version: 0, // bumped when a box breaks (minimap cache invalidation)
    tileAt(tx, ty) {
      if (tx<0||ty<0||tx>=MAP_COLS||ty>=MAP_ROWS) return T_WALL;
      return grid[ty*MAP_COLS+tx];
    },
    tileAtWorld(x, y) { return this.tileAt(Math.floor(x/TILE), Math.floor(y/TILE)); },
    isSolidForMove(t)   { return t===T_WALL||t===T_BOX||t===T_CRATE||t===T_WATER; },
    isSolidForBullet(t) { return t===T_WALL||t===T_BOX||t===T_CRATE; },
    // Only checks the 2x2-3x3 tiles overlapping the circle.
    circleHitsSolid(x, y, r, solidFn) {
      const tx0=Math.floor((x-r)/TILE), tx1=Math.floor((x+r)/TILE);
      const ty0=Math.floor((y-r)/TILE), ty1=Math.floor((y+r)/TILE);
      for (let ty=ty0; ty<=ty1; ty++)
        for (let tx=tx0; tx<=tx1; tx++) {
          const t = this.tileAt(tx, ty);
          if (!solidFn(t)) continue;
          if (circleRect(x, y, r, tx*TILE, ty*TILE, TILE, TILE)) return { tx, ty, type:t };
        }
      return null;
    },
    damageBox(tx, ty, dmg) {
      const i = ty*MAP_COLS+tx;
      const t = grid[i];
      if (t!==T_BOX && t!==T_CRATE) return null;
      boxHp[i] -= dmg;
      if (boxHp[i] > 0) return null;
      grid[i] = T_EMPTY;
      this.version++;
      return t===T_CRATE ? 'crate' : 'box';
    },
    boxHpRatio(tx, ty) {
      const i = ty*MAP_COLS+tx;
      return boxHp[i] / (grid[i]===T_CRATE ? CRATE_HP : BOX_HP);
    },
    inBush(x, y) { return this.tileAtWorld(x, y) === T_BUSH; },
  };
}
let tileMap = buildTileMap();

// ── UTILS ────────────────────────────────────────────────────
function rand(a, b)    { return Math.random() * (b - a) + a; }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function dist(x1,y1,x2,y2) {
  const dx = x2-x1, dy = y2-y1;
  return Math.sqrt(dx*dx + dy*dy);
}
function lerp(a, b, t) { return a + (b - a) * t; }

function circleRect(cx, cy, cr, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx+rw));
  const ny = Math.max(ry, Math.min(cy, ry+rh));
  const dx = cx-nx, dy = cy-ny;
  return dx*dx + dy*dy < cr*cr;
}
// Bush stealth visibility: a target hiding in a bush is only seen
// when revealed (just attacked), at point-blank range, or when the
// viewer shares nearby bushes.
function canSee(viewer, target) {
  if (!target.alive) return false;
  if (!target.inBush || target.revealTimer>0) return true;
  const d = dist(viewer.x, viewer.y, target.x, target.y);
  if (d < 100) return true;
  if (viewer.inBush && d < 180) return true;
  return false;
}

// roundRect polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(typeof r==='number') r=[r,r,r,r];
    this.moveTo(x+r[0],y);
    this.lineTo(x+w-r[1],y);
    this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
    this.lineTo(x+w,y+h-r[2]);
    this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
    this.lineTo(x+r[3],y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
    this.lineTo(x,y+r[0]);
    this.quadraticCurveTo(x,y,x+r[0],y);
    this.closePath();
    return this;
  };
}

// ── BULLET ───────────────────────────────────────────────────
class Bullet {
  constructor(x, y, angle, config, ownerId, opts={}) {
    this.x = x; this.y = y;
    this.startX = x; this.startY = y;
    this.angle = angle;
    this.speed = config.bulletSpeed;
    this.isSuper = !!opts.isSuper;
    this.damage = opts.damage !== undefined ? opts.damage
                : (this.isSuper ? (config.superDamage||config.damage) : config.damage);
    this.range  = opts.range !== undefined ? opts.range
                : config.range * (this.isSuper ? 1.3 : 1);
    this.pierces   = !!opts.pierces;   // Colt super: smashes boxes and keeps flying
    this.knockback = !!opts.knockback; // Shelly super: pushes targets back
    this.falloff   = !!config.falloff && !this.isSuper;
    this.ownerId = ownerId;
    this.radius = 4;
    this.color = config.color;
    this.active = true;
    if (config.spread > 0 && !this.isSuper)
      this.angle += rand(-config.spread/6, config.spread/6);
  }
  // Shotgun-style damage falls to 60% at max range
  hitDamage() {
    if (!this.falloff) return this.damage;
    const t = Math.min(dist(this.startX,this.startY,this.x,this.y)/this.range, 1);
    return this.damage * lerp(1, 0.6, t);
  }
  update() {
    this.x += Math.cos(this.angle)*this.speed;
    this.y += Math.sin(this.angle)*this.speed;
    if (dist(this.startX,this.startY,this.x,this.y) > this.range) { this.active=false; return; }
    if (this.x<0||this.x>ARENA_WIDTH||this.y<0||this.y>ARENA_HEIGHT) { this.active=false; return; }
    const hit = tileMap.circleHitsSolid(this.x, this.y, this.radius, tileMap.isSolidForBullet);
    if (hit) {
      if (hit.type===T_BOX || hit.type===T_CRATE) {
        const broken = tileMap.damageBox(hit.tx, hit.ty, this.isSuper ? 99999 : this.damage);
        if (broken && game) game.onBoxDestroyed(hit.tx, hit.ty, broken);
        if (this.pierces) return;
      }
      this.active = false;
    }
  }
  render(ctx, cx, cy) {
    const sx = this.x-cx, sy = this.y-cy;
    ctx.save();
    ctx.fillStyle = this.isSuper ? '#fff' : this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur  = this.isSuper ? 12 : 6;
    ctx.beginPath();
    ctx.arc(sx, sy, this.isSuper?5:4, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.moveTo(sx-Math.cos(this.angle)*8, sy-Math.sin(this.angle)*8);
    ctx.lineTo(sx, sy);
    ctx.stroke();
    ctx.restore();
  }
}

// ── BEAR (Nita's super) ──────────────────────────────────────
class Bear {
  constructor(x, y, ownerId, damageMult=1) {
    this.x=x; this.y=y;
    this.ownerId=ownerId;
    const cfg = BRAWLER_CONFIGS.nita;
    this.hp=cfg.bearHp; this.maxHp=cfg.bearHp;
    this.damage=cfg.bearDamage*damageMult; this.speed=cfg.bearSpeed;
    this.radius=cfg.bearRadius; this.color='#d2691e';
    this.active=true; this.lifeTimer=cfg.bearDuration;
    this.attackCooldown=0; this.flashTimer=0;
    this.aggroRange=400;
    this.stuckTimer=0; this.sideSign=1;
  }
  update(brawlers) {
    if (!this.active) return;
    this.lifeTimer--;
    if (this.lifeTimer<=0||this.hp<=0) { this.active=false; return; }
    if (this.attackCooldown>0) this.attackCooldown--;
    if (this.flashTimer>0) this.flashTimer--;

    // Nearest visible enemy inside aggro range (bushes hide from the bear too)
    let nearest=null, nd=Infinity;
    for (const b of brawlers) {
      if (b.id===this.ownerId||!b.alive) continue;
      const d=dist(this.x,this.y,b.x,b.y);
      if (d<nd && d<this.aggroRange && canSee(this,b)) { nd=d; nearest=b; }
    }
    // No prey: pad back toward the owner if she's alive
    let goal=nearest;
    if (!goal) {
      const owner=brawlers.find(b=>b.id===this.ownerId);
      if (owner&&owner.alive&&dist(this.x,this.y,owner.x,owner.y)>120) goal=owner;
    }
    if (!goal) return;
    let angle=Math.atan2(goal.y-this.y, goal.x-this.x);
    if (this.stuckTimer>0) { this.stuckTimer--; angle+=this.sideSign*Math.PI/2; }
    const nx=this.x+Math.cos(angle)*this.speed;
    const ny=this.y+Math.sin(angle)*this.speed;
    let moved=false;
    if (!tileMap.circleHitsSolid(nx,this.y,this.radius,tileMap.isSolidForMove)
        && nx>this.radius && nx<ARENA_WIDTH-this.radius)  { this.x=nx; moved=true; }
    if (!tileMap.circleHitsSolid(this.x,ny,this.radius,tileMap.isSolidForMove)
        && ny>this.radius && ny<ARENA_HEIGHT-this.radius) { this.y=ny; moved=true; }
    if (!moved && this.stuckTimer<=0) { this.stuckTimer=30; this.sideSign*=-1; }
    if (nearest && nd < this.radius+nearest.radius+10 && this.attackCooldown<=0) {
      const died=nearest.takeDamage(this.damage, this.ownerId);
      if (died&&game) game.onBrawlerDeath(nearest, this.ownerId);
      this.attackCooldown=25;
    }
  }
  takeDamage(amt) {
    this.hp-=amt; this.flashTimer=5;
    if (this.hp<=0) this.active=false;
  }
  render(ctx, cx, cy) {
    if (!this.active) return;
    const sx=this.x-cx, sy=this.y-cy;
    ctx.save();
    ctx.fillStyle=this.flashTimer>0?'#ff4444':this.color;
    ctx.beginPath(); ctx.arc(sx,sy,this.radius,0,TAU); ctx.fill();
    ctx.strokeStyle='#8b4513'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 13px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🐻',sx,sy);
    // HP bar
    const bw=32, bh=4, bx=sx-bw/2, by=sy-this.radius-10;
    const r=Math.max(0,this.hp/this.maxHp);
    ctx.fillStyle='#333'; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=r>0.5?'#0f0':r>0.25?'#ff0':'#f00';
    ctx.fillRect(bx,by,bw*r,bh);
    // Life ring
    const lr=this.lifeTimer/BRAWLER_CONFIGS.nita.bearDuration;
    ctx.strokeStyle='#ffff00'; ctx.lineWidth=2; ctx.globalAlpha=0.6;
    ctx.beginPath();
    ctx.arc(sx,sy,this.radius+6,-Math.PI/2,-Math.PI/2+TAU*lr);
    ctx.stroke();
    ctx.restore();
  }
}

// ── BRAWLER ───────────────────────────────────────────────────
class Brawler {
  constructor(id, type, x, y, isPlayer=false) {
    this.id=id; this.type=type;
    this.config=BRAWLER_CONFIGS[type];
    this.x=x; this.y=y; this.isPlayer=isPlayer;
    this.maxHp=this.config.hp; this.hp=this.maxHp;
    this.speed=this.config.speed; this.radius=this.config.radius;
    this.color=this.config.color;
    this.maxAmmo=3; this.ammo=3; this.reloadTimer=0; this.shootCooldown=0;
    this.superCharge=0; this.maxSuperCharge=100;
    this.angle=0; this.moveX=0; this.moveY=0;
    this.flashTimer=0; this.shootFlash=0;
    this.alive=true; this.kills=0; this.placement=null;
    this.cubes=0;
    this.inBush=false; this.revealTimer=0;
    this.framesSinceDamage=9999;
    this.isDashing=false; this.dashTimer=0; this.dashAngle=0;
    this.dashHitIds=null;
    this.burst=null;          // Colt burst fire: {left, angle, timer, isSuper, damage, range}
    this.pendingBullets=[];   // drained by Game each frame
  }
  get damageMult() { return 1 + 0.1*this.cubes; }
  update() {
    if (!this.alive) return;
    if (this.shootCooldown>0) this.shootCooldown--;
    if (this.shootFlash>0)    this.shootFlash--;
    if (this.flashTimer>0)    this.flashTimer--;
    if (this.revealTimer>0)   this.revealTimer--;
    this.framesSinceDamage++;
    if (this.ammo<this.maxAmmo) {
      this.reloadTimer--;
      if (this.reloadTimer<=0) { this.ammo++; this.reloadTimer=this.config.reload; }
    }
    // Regen after 3s without damage, ~13.8%/s like Brawl Stars
    if (this.framesSinceDamage>180 && this.hp<this.maxHp) {
      this.hp=Math.min(this.maxHp, this.hp+this.maxHp*0.0023);
      if (game && game.frameCount%30===0) game.spawnParticles(this.x,this.y,'#66ff66',2);
    }
    // Colt fires his burst one bullet at a time, locked to the initial angle
    if (this.burst) {
      this.burst.timer--;
      if (this.burst.timer<=0) { this.fireBurstBullet(); this.burst.timer=4; }
      if (this.burst && this.burst.left<=0) this.burst=null;
    }
    this.inBush=tileMap.inBush(this.x,this.y);
    if (this.isDashing) { this.updateDash(); return; }
    this.updateMovement();
  }
  fireBurstBullet() {
    const b=this.burst;
    this.pendingBullets.push(new Bullet(
      this.x+Math.cos(b.angle)*(this.radius+5),
      this.y+Math.sin(b.angle)*(this.radius+5),
      b.angle+(b.isSuper?rand(-0.04,0.04):0),
      this.config, this.id,
      { isSuper:b.isSuper, damage:b.damage, range:b.range, pierces:b.isSuper }));
    b.left--;
    if (game) game.sound.play('shoot');
  }
  updateMovement() {
    if (this.moveX===0 && this.moveY===0) return;
    const ma=Math.atan2(this.moveY,this.moveX);
    const nx=this.x+Math.cos(ma)*this.speed;
    const ny=this.y+Math.sin(ma)*this.speed;
    const cx=!tileMap.circleHitsSolid(nx,this.y,this.radius,tileMap.isSolidForMove);
    const cy=!tileMap.circleHitsSolid(this.x,ny,this.radius,tileMap.isSolidForMove);
    if (cx && nx>this.radius && nx<ARENA_WIDTH-this.radius)  this.x=nx;
    if (cy && ny>this.radius && ny<ARENA_HEIGHT-this.radius) this.y=ny;
  }
  // Bull dash: single combined-vector check (no diagonal wall clipping),
  // smashes through boxes/crates, stops at rocks/water/border.
  updateDash() {
    this.dashTimer--;
    const nx=this.x+Math.cos(this.dashAngle)*this.config.chargeSpeed;
    const ny=this.y+Math.sin(this.dashAngle)*this.config.chargeSpeed;
    const hit=tileMap.circleHitsSolid(nx,ny,this.radius,tileMap.isSolidForMove);
    if (hit && (hit.type===T_BOX||hit.type===T_CRATE)) {
      const broken=tileMap.damageBox(hit.tx,hit.ty,99999);
      if (broken && game) game.onBoxDestroyed(hit.tx,hit.ty,broken);
    } else if (hit || nx<this.radius || nx>ARENA_WIDTH-this.radius
                   || ny<this.radius || ny>ARENA_HEIGHT-this.radius) {
      this.isDashing=false; return;
    }
    this.x=nx; this.y=ny;
    if (this.dashTimer<=0) this.isDashing=false;
  }
  shoot() {
    if (this.ammo<=0||this.shootCooldown>0||!this.alive||this.burst) return [];
    this.ammo--; this.shootCooldown=this.config.attackCooldown;
    if (this.reloadTimer<=0) this.reloadTimer=this.config.reload;
    this.shootFlash=4; this.revealTimer=60;
    const dmg=this.config.damage*this.damageMult;
    if (this.type==='colt') {
      this.burst={ left:this.config.bulletCount, angle:this.angle, timer:1,
                   isSuper:false, damage:dmg, range:this.config.range };
      return [];
    }
    const bullets=[];
    if (this.config.spread>0) {
      const step=this.config.spread/(this.config.bulletCount-1);
      const start=this.angle-this.config.spread/2;
      for (let i=0;i<this.config.bulletCount;i++)
        bullets.push(new Bullet(
          this.x+Math.cos(this.angle)*(this.radius+5),
          this.y+Math.sin(this.angle)*(this.radius+5),
          start+step*i, this.config, this.id, {damage:dmg}));
    } else {
      bullets.push(new Bullet(
        this.x+Math.cos(this.angle)*(this.radius+5),
        this.y+Math.sin(this.angle)*(this.radius+5),
        this.angle, this.config, this.id, {damage:dmg}));
    }
    return bullets;
  }
  useSuper() {
    if (this.superCharge<this.maxSuperCharge||!this.alive) return null;
    this.superCharge=0; this.revealTimer=60;
    const result={bullets:[], bear:null};
    switch(this.type) {
      case 'shelly': {
        const dmg=this.config.superDamage*this.damageMult;
        const step=this.config.superSpread/(this.config.superBullets-1);
        const start=this.angle-this.config.superSpread/2;
        for (let i=0;i<this.config.superBullets;i++)
          result.bullets.push(new Bullet(
            this.x+Math.cos(this.angle)*(this.radius+5),
            this.y+Math.sin(this.angle)*(this.radius+5),
            start+step*i, this.config, this.id,
            { isSuper:true, damage:dmg, range:this.config.range*1.3, knockback:true }));
        break;
      }
      case 'colt':
        this.burst={ left:this.config.superBurstCount, angle:this.angle, timer:1,
                     isSuper:true, damage:this.config.superDamage*this.damageMult,
                     range:this.config.range*1.5 };
        break;
      case 'bull':
        this.isDashing=true;
        this.dashTimer=this.config.chargeDuration;
        this.dashAngle=this.angle;
        this.dashHitIds=new Set();
        break;
      case 'nita': {
        // Step the spawn point back toward Nita until it's clear of walls
        const cfg=this.config;
        let bx=this.x, by=this.y;
        for (let d=40; d>=0; d-=10) {
          const px=this.x+Math.cos(this.angle)*d;
          const py=this.y+Math.sin(this.angle)*d;
          if (!tileMap.circleHitsSolid(px,py,cfg.bearRadius,tileMap.isSolidForMove)) {
            bx=px; by=py; break;
          }
        }
        result.bear=new Bear(bx, by, this.id, this.damageMult);
        break;
      }
    }
    return result;
  }
  takeDamage(amount, attackerId) {
    if (!this.alive) return false;
    this.hp-=amount; this.flashTimer=8;
    this.framesSinceDamage=0;
    if (this.hp<=0) { this.hp=0; this.alive=false; return true; }
    return false;
  }
  chargeSuper(dmg) {
    this.superCharge=Math.min(this.maxSuperCharge, this.superCharge+dmg*this.config.superChargeRate);
  }
  render(ctx, cx, cy, alpha=1) {
    if (!this.alive) return;
    if (alpha<1) { ctx.save(); ctx.globalAlpha=alpha; }
    const sx=this.x-cx, sy=this.y-cy;
    // Aim line
    ctx.save();
    ctx.strokeStyle=this.color; ctx.globalAlpha=0.15; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(sx,sy);
    ctx.lineTo(sx+Math.cos(this.angle)*this.config.range, sy+Math.sin(this.angle)*this.config.range);
    ctx.stroke(); ctx.restore();
    // Body
    ctx.save();
    ctx.fillStyle=this.flashTimer>0?'#ff3333':this.color;
    if (this.shootFlash>0) { ctx.shadowColor='#fff'; ctx.shadowBlur=15; }
    ctx.beginPath(); ctx.arc(sx,sy,this.radius,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=2; ctx.stroke();
    // Direction dot
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(sx+Math.cos(this.angle)*this.radius*0.6, sy+Math.sin(this.angle)*this.radius*0.6, 4, 0, TAU);
    ctx.fill();
    // Symbol
    ctx.fillStyle='#fff'; ctx.font=`bold ${this.radius}px Arial`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.shadowBlur=0;
    ctx.fillText(this.config.symbol, sx, sy+1);
    ctx.restore();
    // HP bar
    this.renderHpBar(ctx, sx, sy);
    // Super ready ring
    if (this.superCharge>=this.maxSuperCharge) {
      ctx.save();
      ctx.strokeStyle='#ffff00'; ctx.lineWidth=2;
      ctx.shadowColor='#ffff00'; ctx.shadowBlur=6;
      ctx.beginPath(); ctx.arc(sx, sy+this.radius+8, 4, 0, TAU); ctx.stroke();
      ctx.restore();
    }
    if (alpha<1) ctx.restore();
  }
  renderHpBar(ctx, sx, sy) {
    const bw=36, bh=5, bx=sx-bw/2, by=sy-this.radius-12;
    const r=Math.max(0,this.hp/this.maxHp);
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(bx-1,by-1,bw+2,bh+2);
    ctx.fillStyle=r>0.5?'#00ff00':r>0.25?'#ffaa00':'#ff0000';
    ctx.fillRect(bx,by,bw*r,bh);
  }
}

// ── BOT AI ────────────────────────────────────────────────────
// Priority state machine: flee poison > retreat & heal > grab cube
// > fight > break crates > wander. Bots can't see into bushes.
class BotAI {
  constructor(brawler) {
    this.brawler=brawler;
    this.state='wander';
    this.wanderAngle=rand(0,TAU);
    this.wanderTimer=0;
    this.detectionRange=400;
    this.shootRange=brawler.config.range*0.85;
    this.reactionTimer=0;
    this.strafePhase=rand(0,TAU);
    this.lastX=brawler.x; this.lastY=brawler.y;
    this.stuckCheckTimer=20; this.unstuckTimer=0; this.unstuckSign=1;
  }
  // Returns 'shoot' | 'super' | null
  update(allBrawlers, game) {
    const me=this.brawler;
    if (!me.alive||me.isDashing) return null;
    if (this.reactionTimer>0) this.reactionTimer--;
    me.moveX=0; me.moveY=0;

    // Nearest visible enemy
    let enemy=null, ed=Infinity;
    for (const b of allBrawlers) {
      if (b.id===me.id||!b.alive) continue;
      const d=dist(me.x,me.y,b.x,b.y);
      if (d<ed && d<this.detectionRange && canSee(me,b)) { ed=d; enemy=b; }
    }

    let action=null;
    const pz=game.poison;

    if (pz.distInside(me.x,me.y)<60) {
      // 1. Poison at our heels: run for the safe-zone centre
      this.state='flee-poison';
      const zb=pz.bounds();
      const a=Math.atan2((zb.y0+zb.y1)/2-me.y, (zb.x0+zb.x1)/2-me.x);
      me.moveX=Math.cos(a); me.moveY=Math.sin(a); me.angle=a;
    } else if (me.hp<0.35*me.maxHp && enemy && ed<300) {
      // 2. Low HP under fire: panic super, then run for a bush
      this.state='retreat';
      if (me.superCharge>=me.maxSuperCharge && ed<250) {
        me.angle=Math.atan2(enemy.y-me.y, enemy.x-me.x);
        action='super';
      }
      const bush=this.findNearestTile(T_BUSH,5);
      const a=bush ? Math.atan2(bush.y-me.y, bush.x-me.x)
                   : Math.atan2(me.y-enemy.y, me.x-enemy.x);
      me.moveX=Math.cos(a); me.moveY=Math.sin(a);
    } else if (me.inBush && me.hp<0.7*me.maxHp && (!enemy||ed>220)) {
      // 3. Wounded and hidden: sit still and let regen tick
      this.state='heal';
    } else {
      let cube=null, cd=Infinity;
      for (const c of game.cubes) {
        const d=dist(me.x,me.y,c.x,c.y);
        if (d<cd && d<350) { cd=d; cube=c; }
      }
      if (cube && (!enemy||ed>200)) {
        // 4. Free power cube nearby
        this.state='grab-cube';
        const a=Math.atan2(cube.y-me.y, cube.x-me.x);
        me.moveX=Math.cos(a); me.moveY=Math.sin(a); me.angle=a;
      } else if (enemy) {
        // 5. Fight
        this.state='fight';
        if (this.trySuper(enemy,ed)) action='super';
        else action=this.fight(enemy,ed);
      } else {
        // 6. Crack open cube crates, otherwise wander
        const crate=this.findNearestTile(T_CRATE,5);
        if (crate) {
          this.state='break-crate';
          const a=Math.atan2(crate.y-me.y, crate.x-me.x);
          me.angle=a;
          if (crate.d>me.config.range*0.7) { me.moveX=Math.cos(a); me.moveY=Math.sin(a); }
          else if (me.ammo>0&&!me.burst&&this.reactionTimer<=0) {
            this.reactionTimer=12+randInt(0,10);
            action='shoot';
          }
        } else {
          this.wanderBehavior(game);
        }
      }
    }

    this.antiStuck(me);
    return action;
  }
  trySuper(enemy, ed) {
    const me=this.brawler;
    if (me.superCharge<me.maxSuperCharge) return false;
    const angTo=Math.atan2(enemy.y-me.y, enemy.x-me.x);
    let ok=false;
    switch(me.type) {
      case 'bull':   ok = ed>120 && ed<350; break;
      case 'nita':   ok = ed<280; break;
      case 'shelly': ok = ed<me.config.range*0.8; break;
      case 'colt':   ok = ed<me.config.range*1.2; break;
    }
    if (!ok && me.hp<0.25*me.maxHp && ed<250) ok=true;
    if (ok) me.angle=angTo;
    return ok;
  }
  fight(enemy, ed) {
    const me=this.brawler;
    const a=Math.atan2(enemy.y-me.y, enemy.x-me.x);
    me.angle=a;
    this.strafePhase+=0.04;
    const strafe=Math.sin(this.strafePhase);
    let mx=0, my=0;
    if (ed>this.shootRange*0.6)      { mx=Math.cos(a); my=Math.sin(a); }
    else if (ed<this.shootRange*0.3) { mx=-Math.cos(a)*0.7; my=-Math.sin(a)*0.7; }
    mx+=Math.cos(a+Math.PI/2)*strafe*0.6;
    my+=Math.sin(a+Math.PI/2)*strafe*0.6;
    me.moveX=mx; me.moveY=my;
    if (ed<this.shootRange && me.ammo>0 && !me.burst && this.reactionTimer<=0) {
      this.reactionTimer=8+randInt(0,10);
      return 'shoot';
    }
    return null;
  }
  findNearestTile(type, radiusTiles) {
    const me=this.brawler;
    const mtx=Math.floor(me.x/TILE), mty=Math.floor(me.y/TILE);
    let best=null, bd=Infinity;
    for (let ty=mty-radiusTiles; ty<=mty+radiusTiles; ty++)
      for (let tx=mtx-radiusTiles; tx<=mtx+radiusTiles; tx++) {
        if (tileMap.tileAt(tx,ty)!==type) continue;
        const cx=(tx+0.5)*TILE, cy=(ty+0.5)*TILE;
        const d=dist(me.x,me.y,cx,cy);
        if (d<bd) { bd=d; best={x:cx, y:cy, d}; }
      }
    return best;
  }
  wanderBehavior(game) {
    this.state='wander';
    this.wanderTimer--;
    if (this.wanderTimer<=0) {
      this.wanderAngle=rand(0,TAU);
      this.wanderTimer=randInt(40,100);
    }
    // Drift toward the safe zone centre when near the poison edge
    if (game.poison.distInside(this.brawler.x,this.brawler.y)<200) {
      const zb=game.poison.bounds();
      this.wanderAngle=Math.atan2((zb.y0+zb.y1)/2-this.brawler.y,(zb.x0+zb.x1)/2-this.brawler.x);
    }
    this.brawler.moveX=Math.cos(this.wanderAngle);
    this.brawler.moveY=Math.sin(this.wanderAngle);
    this.brawler.angle=this.wanderAngle;
  }
  // When pressed against a wall, slide perpendicular for a moment
  antiStuck(me) {
    this.stuckCheckTimer--;
    if (this.stuckCheckTimer<=0) {
      const moved=dist(me.x,me.y,this.lastX,this.lastY);
      if ((me.moveX!==0||me.moveY!==0) && moved<3) {
        this.unstuckTimer=30; this.unstuckSign*=-1;
      }
      this.lastX=me.x; this.lastY=me.y; this.stuckCheckTimer=20;
    }
    if (this.unstuckTimer>0 && (me.moveX!==0||me.moveY!==0)) {
      this.unstuckTimer--;
      const a=Math.atan2(me.moveY,me.moveX)+this.unstuckSign*Math.PI/2;
      const m=Math.min(Math.hypot(me.moveX,me.moveY),1);
      me.moveX=Math.cos(a)*m; me.moveY=Math.sin(a)*m;
    }
  }
}

// ── PARTICLE ─────────────────────────────────────────────────
class Particle {
  constructor(x,y,color,speed,life,size) {
    this.x=x; this.y=y; this.color=color;
    this.angle=rand(0,TAU); this.speed=speed;
    this.life=life; this.maxLife=life; this.size=size; this.active=true;
  }
  update() {
    this.x+=Math.cos(this.angle)*this.speed;
    this.y+=Math.sin(this.angle)*this.speed;
    this.speed*=0.92;
    this.life--;
    if (this.life<=0) this.active=false;
  }
  render(ctx,cx,cy) {
    ctx.save();
    ctx.globalAlpha=this.life/this.maxLife;
    ctx.fillStyle=this.color;
    ctx.fillRect(this.x-cx-this.size/2, this.y-cy-this.size/2, this.size, this.size);
    ctx.restore();
  }
}

// ── POWER CUBE ───────────────────────────────────────────────
class PowerCube {
  constructor(x, y) {
    this.x=x; this.y=y; this.active=true;
    this.bobPhase=rand(0,TAU);
  }
  render(ctx) {
    const bob=Math.sin((game?game.frameCount:0)*0.1+this.bobPhase)*3;
    ctx.save();
    ctx.translate(this.x, this.y+bob);
    ctx.rotate(Math.PI/4);
    ctx.fillStyle='#bb44ff';
    ctx.shadowColor='#bb44ff'; ctx.shadowBlur=10;
    ctx.fillRect(-9,-9,18,18);
    ctx.shadowBlur=0;
    ctx.strokeStyle='#eeccff'; ctx.lineWidth=2;
    ctx.strokeRect(-9,-9,18,18);
    ctx.restore();
  }
}

// ── POISON ZONE (shrinking showdown cloud) ──────────────────
class PoisonZone {
  constructor() {
    this.ring=0; this.maxRing=10;
    this.nextShrinkSec=20; this.shrinkInterval=10;
    this.warnTimer=0; this.tickTimer=0;
  }
  bounds() {
    const m=this.ring*TILE;
    return { x0:m, y0:m, x1:ARENA_WIDTH-m, y1:ARENA_HEIGHT-m };
  }
  contains(x, y) {
    const b=this.bounds();
    return x>=b.x0 && x<=b.x1 && y>=b.y0 && y<=b.y1;
  }
  // Distance to the nearest zone edge; negative when outside
  distInside(x, y) {
    const b=this.bounds();
    return Math.min(x-b.x0, b.x1-x, y-b.y0, b.y1-y);
  }
  update(game) {
    const elapsed=MATCH_DURATION-game.matchTimer;
    if (this.ring<this.maxRing) {
      if (elapsed>=this.nextShrinkSec) {
        this.ring++; this.nextShrinkSec+=this.shrinkInterval;
        this.warnTimer=0;
        game.sound.play('poisonWarn');
      } else if (elapsed>=this.nextShrinkSec-3) {
        this.warnTimer=2; // kept alive while inside the warning window
      }
    }
    if (this.warnTimer>0) this.warnTimer--;
    this.tickTimer++;
    if (this.tickTimer>=15) {
      this.tickTimer=0;
      // 250 every 15 frames = 1000 dmg/s; doesn't charge anyone's super
      for (const b of game.brawlers) {
        if (!b.alive||this.contains(b.x,b.y)) continue;
        const died=b.takeDamage(250, null);
        if (b.isPlayer) game.sound.play('poisonTick');
        if (died) game.onBrawlerDeath(b, null);
      }
      for (const bear of game.bears)
        if (bear.active && !this.contains(bear.x,bear.y)) bear.takeDamage(250);
    }
  }
  render(ctx) {
    const b=this.bounds();
    ctx.save();
    ctx.fillStyle='rgba(40,90,30,0.55)';
    if (b.y0>0)            ctx.fillRect(0, 0, ARENA_WIDTH, b.y0);
    if (b.y1<ARENA_HEIGHT) ctx.fillRect(0, b.y1, ARENA_WIDTH, ARENA_HEIGHT-b.y1);
    if (b.x0>0)            ctx.fillRect(0, b.y0, b.x0, b.y1-b.y0);
    if (b.x1<ARENA_WIDTH)  ctx.fillRect(b.x1, b.y0, ARENA_WIDTH-b.x1, b.y1-b.y0);
    const pulse=0.45+0.25*Math.sin((game?game.frameCount:0)*0.08);
    ctx.strokeStyle=`rgba(120,255,80,${pulse})`;
    ctx.lineWidth=4;
    ctx.strokeRect(b.x0, b.y0, b.x1-b.x0, b.y1-b.y0);
    ctx.restore();
  }
}

// ── SOUND (Web Audio synthesis, no files) ────────────────────
class SoundManager {
  constructor() { this.ctx=null; this.master=null; this.lastPlayed={}; }
  // Must be called from a user gesture (tap/click) for iOS/Chrome autoplay policy
  unlock() {
    if (!this.ctx) {
      try {
        const AC=window.AudioContext||window.webkitAudioContext;
        this.ctx=new AC();
        this.master=this.ctx.createGain();
        this.master.gain.value=0.3;
        this.master.connect(this.ctx.destination);
      } catch(e) { this.ctx=null; }
    }
    if (this.ctx && this.ctx.state==='suspended') this.ctx.resume();
  }
  tone(freq, dur, type='square', vol=1, freqEnd=null) {
    if (!this.ctx) return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd!==null) o.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t+dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur);
  }
  noise(dur, vol=1, filterFreq=1000) {
    if (!this.ctx) return;
    const t=this.ctx.currentTime;
    const len=Math.max(1, Math.floor(this.ctx.sampleRate*dur));
    const buf=this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data=buf.getChannelData(0);
    for (let i=0;i<len;i++) data[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filterFreq;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  }
  play(name) {
    if (!this.ctx) return;
    const now=performance.now();
    if (this.lastPlayed[name] && now-this.lastPlayed[name]<50) return; // anti-spam
    this.lastPlayed[name]=now;
    switch(name) {
      case 'shoot':      this.noise(0.06,0.5,2500); this.tone(200,0.07,'square',0.25,120); break;
      case 'hit':        this.tone(160,0.06,'triangle',0.5); break;
      case 'super':      this.tone(100,0.3,'sawtooth',0.5,600); break;
      case 'boxBreak':   this.noise(0.25,0.7,400); break;
      case 'cubePickup': this.tone(660,0.09,'sine',0.5); setTimeout(()=>this.tone(990,0.12,'sine',0.5),90); break;
      case 'death':      this.tone(300,0.4,'sawtooth',0.6,60); break;
      case 'poisonTick': this.tone(90,0.1,'sine',0.4); break;
      case 'poisonWarn': this.tone(440,0.15,'square',0.4); setTimeout(()=>this.tone(440,0.15,'square',0.4),200); break;
      case 'victory':    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,0.25,'square',0.5),i*150)); break;
      case 'defeat':     [392,330,262].forEach((f,i)=>setTimeout(()=>this.tone(f,0.3,'square',0.5),i*200)); break;
    }
  }
}

// ── VIRTUAL JOYSTICK (Brawl Stars-style touch control) ───────
class VirtualJoystick {
  constructor(x, y, baseRadius, knobRadius) {
    this.baseX=x; this.baseY=y;
    this.baseRadius=baseRadius; this.knobRadius=knobRadius;
    this.touchId=null; this.active=false;
    this.dx=0; this.dy=0; this.magnitude=0;
    this.knobX=x; this.knobY=y;
    this.startTime=0; this.maxMagnitude=0;
    this.enabled=true;
  }
  contains(x, y) {
    return dist(x,y,this.baseX,this.baseY) <= this.baseRadius*1.7;
  }
  tryStart(x, y, id) {
    if (!this.enabled||this.active||!this.contains(x,y)) return false;
    this.touchId=id; this.active=true;
    this.startTime=performance.now(); this.maxMagnitude=0;
    this.move(x,y);
    return true;
  }
  move(x, y) {
    let dx=x-this.baseX, dy=y-this.baseY;
    const d=Math.sqrt(dx*dx+dy*dy);
    this.magnitude=Math.min(d/this.baseRadius,1);
    this.maxMagnitude=Math.max(this.maxMagnitude,this.magnitude);
    if (d>0) { this.dx=dx/d*this.magnitude; this.dy=dy/d*this.magnitude; }
    else     { this.dx=0; this.dy=0; }
    const kd=Math.min(d,this.baseRadius);
    this.knobX=this.baseX+(d>0?dx/d*kd:0);
    this.knobY=this.baseY+(d>0?dy/d*kd:0);
  }
  end() {
    const result={
      dx:this.dx, dy:this.dy, magnitude:this.magnitude,
      angle:Math.atan2(this.dy,this.dx),
      wasTap:(performance.now()-this.startTime)<250 && this.maxMagnitude<0.3
    };
    this.touchId=null; this.active=false;
    this.dx=0; this.dy=0; this.magnitude=0;
    this.knobX=this.baseX; this.knobY=this.baseY;
    return result;
  }
  renderBase(ctx, ringColor) {
    ctx.fillStyle='rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.arc(this.baseX,this.baseY,this.baseRadius,0,TAU); ctx.fill();
    ctx.strokeStyle=ringColor||'rgba(255,255,255,0.35)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(this.baseX,this.baseY,this.baseRadius,0,TAU); ctx.stroke();
  }
}

// ── GAME ──────────────────────────────────────────────────────
class Game {
  constructor() {
    this.canvas=document.getElementById('gameCanvas');
    this.ctx=this.canvas.getContext('2d');
    this.resizeCanvas();
    window.addEventListener('resize',()=>this.resizeCanvas());

    this.state=GameState.MENU;
    this.menuState='main';
    this.matchTimer=MATCH_DURATION;
    this.matchTimerDisplay=MATCH_DURATION;
    this.frameCount=0;

    this.brawlers=[]; this.bullets=[]; this.bears=[]; this.particles=[]; this.botAIs=[];
    this.cubes=[];
    this.poison=new PoisonZone();
    this.sound=new SoundManager();
    this.aliveCount=0;
    this.gameOverDelay=0;
    this.mmCanvas=null; this.mmVersion=-1; // minimap tile cache
    this.player=null;
    this.camera={x:0,y:0};
    this.keys={};
    this.mouse={x:0,y:0,down:false};
    this.mouseWorld={x:0,y:0};
    this.hoverBrawler=null;
    this.startBtnRect=null;
    this.brawlerCardRects=[];
    this.playAgainBtn=null;

    // Mobile twin-stick controls (Brawl Stars layout)
    this.moveStick  =new VirtualJoystick(108, CANVAS_HEIGHT-108, 56, 26);
    this.attackStick=new VirtualJoystick(CANVAS_WIDTH-105, CANVAS_HEIGHT-105, 56, 28);
    this.superStick =new VirtualJoystick(CANVAS_WIDTH-202, CANVAS_HEIGHT-192, 42, 22);
    this.touchAimMode=null; // null | 'attack' | 'super'

    this.setupInput();
    this.lastTime=0;
    requestAnimationFrame(t=>this.loop(t));
  }

  resizeCanvas() {
    const aspect=CANVAS_WIDTH/CANVAS_HEIGHT;
    const wa=window.innerWidth/window.innerHeight;
    if (wa>aspect) {
      this.canvas.height=window.innerHeight;
      this.canvas.width=window.innerHeight*aspect;
    } else {
      this.canvas.width=window.innerWidth;
      this.canvas.height=window.innerWidth/aspect;
    }
  }

  setupInput() {
    window.addEventListener('keydown',e=>{
      this.keys[e.key.toLowerCase()]=true;
      if (e.key===' ' && this.state===GameState.PLAYING) {
        e.preventDefault(); this.activatePlayerSuper();
      }
    });
    window.addEventListener('keyup',e=>{ this.keys[e.key.toLowerCase()]=false; });
    this.canvas.addEventListener('mousemove',e=>{
      const p=this.toCanvasCoords(e.clientX,e.clientY);
      this.mouse.x=p.x; this.mouse.y=p.y;
      this.updateHover();
    });
    this.canvas.addEventListener('mousedown',e=>{
      this.sound.unlock();
      if (e.button===0) this.mouse.down=true;
      if (this.state===GameState.MENU||this.state===GameState.GAME_OVER)
        this.handleMenuClick();
    });
    this.canvas.addEventListener('mouseup',e=>{ if(e.button===0) this.mouse.down=false; });
    this.canvas.addEventListener('contextmenu',e=>e.preventDefault());

    // Touch controls
    this.canvas.addEventListener('touchstart',e=>{ e.preventDefault(); this.onTouchStart(e); },{passive:false});
    this.canvas.addEventListener('touchmove', e=>{ e.preventDefault(); this.onTouchMove(e);  },{passive:false});
    this.canvas.addEventListener('touchend',  e=>{ e.preventDefault(); this.onTouchEnd(e);   },{passive:false});
    this.canvas.addEventListener('touchcancel',e=>{ e.preventDefault(); this.onTouchEnd(e);  },{passive:false});
  }

  toCanvasCoords(clientX, clientY) {
    const rect=this.canvas.getBoundingClientRect();
    const sx=this.canvas.width/CANVAS_WIDTH, sy=this.canvas.height/CANVAS_HEIGHT;
    return { x:(clientX-rect.left)/sx, y:(clientY-rect.top)/sy };
  }

  // ── TOUCH HANDLERS ───────────────────────────────────────
  onTouchStart(e) {
    this.sound.unlock();
    for (const t of e.changedTouches) {
      const p=this.toCanvasCoords(t.clientX,t.clientY);
      if (this.state===GameState.MENU||this.state===GameState.GAME_OVER) {
        this.mouse.x=p.x; this.mouse.y=p.y;
        this.updateHover();
        this.handleMenuClick();
        continue;
      }
      if (this.state!==GameState.PLAYING) continue;
      // Super stick only grabs touches when charged
      this.superStick.enabled = !!this.player && this.player.superCharge>=this.player.maxSuperCharge;
      if (this.superStick.tryStart(p.x,p.y,t.identifier))  { this.touchAimMode='super';  continue; }
      if (this.attackStick.tryStart(p.x,p.y,t.identifier)) { this.touchAimMode='attack'; continue; }
      this.moveStick.tryStart(p.x,p.y,t.identifier);
    }
  }

  onTouchMove(e) {
    for (const t of e.changedTouches) {
      const p=this.toCanvasCoords(t.clientX,t.clientY);
      for (const stick of [this.moveStick,this.attackStick,this.superStick])
        if (stick.active&&stick.touchId===t.identifier) stick.move(p.x,p.y);
    }
  }

  onTouchEnd(e) {
    for (const t of e.changedTouches) {
      if (this.moveStick.active&&this.moveStick.touchId===t.identifier) {
        this.moveStick.end();
        if (this.player) { this.player.moveX=0; this.player.moveY=0; }
        continue;
      }
      if (this.attackStick.active&&this.attackStick.touchId===t.identifier) {
        const r=this.attackStick.end();
        if (this.touchAimMode==='attack') this.touchAimMode=null;
        this.releaseAttack(r);
        continue;
      }
      if (this.superStick.active&&this.superStick.touchId===t.identifier) {
        const r=this.superStick.end();
        if (this.touchAimMode==='super') this.touchAimMode=null;
        this.releaseSuper(r);
      }
    }
  }

  releaseAttack(r) {
    if (!this.player||!this.player.alive) return;
    if (r.wasTap) {
      // Quick tap = auto-aim at nearest enemy (Brawl Stars behaviour)
      const a=this.autoAimAngle(this.player.config.range*1.2);
      if (a!==null) this.player.angle=a;
      this.playerShoot();
    } else if (r.magnitude>=0.3) {
      this.player.angle=r.angle;
      this.playerShoot();
    }
    // released near the centre after dragging = cancel, no shot
  }

  releaseSuper(r) {
    if (!this.player||!this.player.alive) return;
    if (this.player.superCharge<this.player.maxSuperCharge) return;
    if (r.wasTap) {
      const a=this.autoAimAngle(this.player.config.range*1.5);
      this.activatePlayerSuper(a!==null?a:this.player.angle);
    } else if (r.magnitude>=0.3) {
      this.activatePlayerSuper(r.angle);
    }
    // released near the centre after dragging = cancel
  }

  autoAimAngle(range) {
    if (!this.player) return null;
    let best=null, bd=Infinity;
    for (const b of this.brawlers) {
      // canSee: never auto-aim at enemies hidden in bushes
      if (b.id===this.player.id||!b.alive||!canSee(this.player,b)) continue;
      const d=dist(this.player.x,this.player.y,b.x,b.y);
      if (d<bd&&d<range) { bd=d; best=b; }
    }
    return best ? Math.atan2(best.y-this.player.y, best.x-this.player.x) : null;
  }

  playerShoot() {
    if (!this.player) return;
    const hadAmmoBurst=!!this.player.burst;
    const bs=this.player.shoot();
    if (bs.length) {
      this.bullets.push(...bs);
      this.sound.play('shoot');
      this.spawnParticles(
        this.player.x+Math.cos(this.player.angle)*this.player.radius,
        this.player.y+Math.sin(this.player.angle)*this.player.radius,
        this.player.color, 6);
    } else if (!hadAmmoBurst&&this.player.burst) {
      // Colt: shot accepted, bullets stream out via burst
      this.spawnParticles(
        this.player.x+Math.cos(this.player.angle)*this.player.radius,
        this.player.y+Math.sin(this.player.angle)*this.player.radius,
        this.player.color, 6);
    }
  }

  startMatch(type) {
    this.state=GameState.PLAYING;
    this.matchTimer=MATCH_DURATION; this.matchTimerDisplay=MATCH_DURATION;
    this.brawlers=[]; this.bullets=[]; this.bears=[]; this.particles=[]; this.botAIs=[];
    this.cubes=[];
    tileMap=buildTileMap();
    this.poison=new PoisonZone();
    this.mmCanvas=null; this.mmVersion=-1;
    this.frameCount=0;
    this.touchAimMode=null;
    this.gameOverDelay=0;

    // Shuffle the 8 map spawn points; player takes one, bots take the rest
    const spawns=[...tileMap.spawnPoints];
    for (let i=spawns.length-1;i>0;i--) {
      const j=randInt(0,i); [spawns[i],spawns[j]]=[spawns[j],spawns[i]];
    }
    this.player=new Brawler('player',type,spawns[0].x,spawns[0].y,true);
    this.brawlers.push(this.player);
    const types=['shelly','colt','bull','nita'];
    for (let i=1;i<TOTAL_PLAYERS;i++) {
      const sp=spawns[i%spawns.length];
      const bot=new Brawler(`bot_${i}`,types[i%4],sp.x,sp.y,false);
      this.brawlers.push(bot);
      this.botAIs.push(new BotAI(bot));
    }
    this.aliveCount=TOTAL_PLAYERS;
    // Snap camera to spawn
    this.camera.x=Math.max(0,Math.min(ARENA_WIDTH-CANVAS_WIDTH,this.player.x-CANVAS_WIDTH/2));
    this.camera.y=Math.max(0,Math.min(ARENA_HEIGHT-CANVAS_HEIGHT,this.player.y-CANVAS_HEIGHT/2));
  }

  activatePlayerSuper(angle) {
    if (!this.player||this.player.superCharge<this.player.maxSuperCharge) return;
    this.player.angle = (angle!==undefined)
      ? angle
      : Math.atan2(this.mouseWorld.y-this.player.y, this.mouseWorld.x-this.player.x);
    const r=this.player.useSuper();
    if (r) {
      if (r.bullets) this.bullets.push(...r.bullets);
      if (r.bear)    this.bears.push(r.bear);
      this.sound.play('super');
      this.spawnParticles(this.player.x, this.player.y, this.player.color, 20);
    }
  }

  // ── SHOWDOWN EVENTS ───────────────────────────────────────
  onBoxDestroyed(tx, ty, kind) {
    const cx=(tx+0.5)*TILE, cy=(ty+0.5)*TILE;
    this.spawnParticles(cx, cy, '#8b7355', 12);
    this.sound.play('boxBreak');
    if (kind==='crate') this.cubes.push(new PowerCube(cx, cy));
  }

  onBrawlerDeath(b, killerId) {
    if (b.placement!==null) return; // already processed
    b.placement=this.aliveCount;
    this.aliveCount--;
    this.spawnExplosion(b.x, b.y, b.color);
    this.sound.play('death');
    // Dead brawlers drop their cubes
    for (let i=0;i<b.cubes;i++) {
      const a=rand(0,TAU), d=rand(10,40);
      let cx=b.x+Math.cos(a)*d, cy=b.y+Math.sin(a)*d;
      if (tileMap.circleHitsSolid(cx,cy,10,tileMap.isSolidForMove)) { cx=b.x; cy=b.y; }
      this.cubes.push(new PowerCube(cx, cy));
    }
    if (killerId) {
      const killer=this.brawlers.find(x=>x.id===killerId);
      if (killer) killer.kills++;
    }
    if (this.aliveCount<=1) {
      const last=this.brawlers.find(x=>x.alive);
      if (last) last.placement=1;
      this.gameOverDelay=90;
    } else if (b.isPlayer) {
      this.gameOverDelay=120; // show the field a moment before the results
    }
  }

  endMatch() {
    // Timer ran out / delay elapsed: rank whoever is still standing
    const alive=this.brawlers.filter(x=>x.alive&&x.placement===null)
      .sort((a,b)=>(b.hp+b.cubes*400)-(a.hp+a.cubes*400));
    alive.forEach((x,i)=>x.placement=i+1);
    this.state=GameState.GAME_OVER;
    this.sound.play(this.player&&this.player.placement===1?'victory':'defeat');
  }

  spawnParticles(x,y,color,n) {
    for(let i=0;i<n;i++)
      this.particles.push(new Particle(x,y,color,rand(1,4),randInt(10,25),randInt(2,5)));
  }
  spawnExplosion(x,y,color) {
    for(let i=0;i<30;i++)
      this.particles.push(new Particle(x,y,color,rand(2,6),randInt(20,45),randInt(3,7)));
  }

  // Shelly super: push the target along the bullet path, stopping at walls
  applyKnockback(b, angle, distPx) {
    const steps=5, step=distPx/steps;
    for (let i=0;i<steps;i++) {
      const nx=b.x+Math.cos(angle)*step, ny=b.y+Math.sin(angle)*step;
      if (tileMap.circleHitsSolid(nx,ny,b.radius,tileMap.isSolidForMove)) break;
      if (nx<b.radius||nx>ARENA_WIDTH-b.radius||ny<b.radius||ny>ARENA_HEIGHT-b.radius) break;
      b.x=nx; b.y=ny;
    }
  }

  loop(ts) {
    this.lastTime=ts; this.frameCount++;
    this.mouseWorld.x=this.mouse.x+this.camera.x;
    this.mouseWorld.y=this.mouse.y+this.camera.y;
    if (this.state===GameState.PLAYING) this.update();
    this.render();
    requestAnimationFrame(t=>this.loop(t));
  }

  update() {
    // Timer (fail-safe — matches normally end by elimination)
    if (this.frameCount%60===0) {
      this.matchTimer--;
      this.matchTimerDisplay=Math.max(0,this.matchTimer);
      if (this.matchTimer<=0) { this.endMatch(); return; }
    }
    if (this.gameOverDelay>0) {
      this.gameOverDelay--;
      if (this.gameOverDelay<=0) { this.endMatch(); return; }
    }

    // Player input
    if (this.player&&this.player.alive) {
      this.player.moveX=0; this.player.moveY=0;
      if (this.moveStick.active&&this.moveStick.magnitude>0.15) {
        // Touch: analog joystick movement
        this.player.moveX=this.moveStick.dx;
        this.player.moveY=this.moveStick.dy;
      } else {
        if (this.keys['w']||this.keys['arrowup'])    this.player.moveY=-1;
        if (this.keys['s']||this.keys['arrowdown'])  this.player.moveY=1;
        if (this.keys['a']||this.keys['arrowleft'])  this.player.moveX=-1;
        if (this.keys['d']||this.keys['arrowright']) this.player.moveX=1;
        if (this.player.moveX!==0&&this.player.moveY!==0) {
          this.player.moveX*=0.707; this.player.moveY*=0.707;
        }
      }

      // Aiming: active touch stick wins, otherwise mouse (desktop only)
      if (this.superStick.active&&this.superStick.magnitude>0.2) {
        this.player.angle=Math.atan2(this.superStick.dy,this.superStick.dx);
      } else if (this.attackStick.active&&this.attackStick.magnitude>0.2) {
        this.player.angle=Math.atan2(this.attackStick.dy,this.attackStick.dx);
      } else if (!IS_TOUCH) {
        this.player.angle=Math.atan2(this.mouseWorld.y-this.player.y, this.mouseWorld.x-this.player.x);
      }

      if (!IS_TOUCH&&this.mouse.down&&this.player.ammo>0&&this.player.shootCooldown<=0)
        this.playerShoot();
    }

    // Update brawlers
    for (const b of this.brawlers) b.update();

    // Bot AI
    for (const ai of this.botAIs) {
      const action=ai.update(this.brawlers, this);
      if (action==='shoot') {
        const bs=ai.brawler.shoot();
        if (bs.length) {
          this.bullets.push(...bs);
          this.sound.play('shoot');
          this.spawnParticles(
            ai.brawler.x+Math.cos(ai.brawler.angle)*ai.brawler.radius,
            ai.brawler.y+Math.sin(ai.brawler.angle)*ai.brawler.radius,
            ai.brawler.color, 4);
        }
      } else if (action==='super') {
        const r=ai.brawler.useSuper();
        if (r) {
          if (r.bullets.length) this.bullets.push(...r.bullets);
          if (r.bear)           this.bears.push(r.bear);
          this.sound.play('super');
        }
      }
    }

    // Drain burst-fire bullets (Colt)
    for (const b of this.brawlers) {
      if (b.pendingBullets.length) {
        this.bullets.push(...b.pendingBullets);
        b.pendingBullets.length=0;
      }
    }

    // Poison cloud
    this.poison.update(this);

    // Power cube pickup
    for (const c of this.cubes) {
      if (!c.active) continue;
      for (const b of this.brawlers) {
        if (!b.alive) continue;
        if (dist(c.x,c.y,b.x,b.y) < b.radius+14) {
          c.active=false;
          b.cubes++; b.maxHp+=400; b.hp+=400;
          this.spawnParticles(c.x,c.y,'#bb44ff',10);
          if (b.isPlayer) this.sound.play('cubePickup');
          break;
        }
      }
    }
    this.cubes=this.cubes.filter(c=>c.active);

    // Update projectiles & entities
    for (const b of this.bullets) b.update();
    this.bullets=this.bullets.filter(b=>b.active);
    for (const b of this.bears) b.update(this.brawlers);
    this.bears=this.bears.filter(b=>b.active);
    for (const p of this.particles) p.update();
    this.particles=this.particles.filter(p=>p.active);

    // Bullet vs Brawler / Bear collision
    for (const bullet of this.bullets) {
      if (!bullet.active) continue;
      let consumed=false;
      for (const brawler of this.brawlers) {
        if (bullet.ownerId===brawler.id||!brawler.alive) continue;
        if (dist(bullet.x,bullet.y,brawler.x,brawler.y) < bullet.radius+brawler.radius) {
          bullet.active=false; consumed=true;
          const dmg=bullet.hitDamage();
          const died=brawler.takeDamage(dmg, bullet.ownerId);
          this.spawnParticles(bullet.x, bullet.y, brawler.color, 6);
          this.sound.play('hit');
          const att=this.brawlers.find(b=>b.id===bullet.ownerId);
          if (att&&att.alive) att.chargeSuper(dmg);
          if (bullet.knockback&&!died) this.applyKnockback(brawler, bullet.angle, 50);
          if (died) this.onBrawlerDeath(brawler, bullet.ownerId);
          break;
        }
      }
      if (consumed) continue;
      for (const bear of this.bears) {
        if (!bear.active||bullet.ownerId===bear.ownerId) continue;
        if (dist(bullet.x,bullet.y,bear.x,bear.y) < bullet.radius+bear.radius) {
          bullet.active=false;
          const dmg=bullet.hitDamage();
          bear.takeDamage(dmg);
          this.spawnParticles(bullet.x, bullet.y, bear.color, 5);
          this.sound.play('hit');
          const att=this.brawlers.find(b=>b.id===bullet.ownerId);
          if (att&&att.alive) att.chargeSuper(dmg*0.5);
          break;
        }
      }
    }

    // Bull dash damage — once per enemy per dash
    for (const b of this.brawlers) {
      if (!b.isDashing||!b.dashHitIds) continue;
      for (const t of this.brawlers) {
        if (t.id===b.id||!t.alive||b.dashHitIds.has(t.id)) continue;
        if (dist(b.x,b.y,t.x,t.y) < b.radius+t.radius+10) {
          b.dashHitIds.add(t.id);
          const dmg=b.config.superDamage*b.damageMult;
          const died=t.takeDamage(dmg, b.id);
          b.chargeSuper(dmg);
          this.spawnParticles(t.x,t.y,t.color,10);
          this.sound.play('hit');
          if (died) this.onBrawlerDeath(t, b.id);
        }
      }
    }

    // Camera
    if (this.player) {
      const tx=this.player.x-CANVAS_WIDTH/2;
      const ty=this.player.y-CANVAS_HEIGHT/2;
      this.camera.x=lerp(this.camera.x,tx,0.12);
      this.camera.y=lerp(this.camera.y,ty,0.12);
      this.camera.x=Math.max(0,Math.min(ARENA_WIDTH-CANVAS_WIDTH,this.camera.x));
      this.camera.y=Math.max(0,Math.min(ARENA_HEIGHT-CANVAS_HEIGHT,this.camera.y));
    }
  }

  // ── RENDER ────────────────────────────────────────────────
  render() {
    const ctx=this.ctx, w=CANVAS_WIDTH, h=CANVAS_HEIGHT;
    const sx=this.canvas.width/w, sy=this.canvas.height/h;
    ctx.save(); ctx.scale(sx,sy);
    if      (this.state===GameState.MENU)      this.renderMenu(ctx,w,h);
    else if (this.state===GameState.PLAYING)   this.renderGame(ctx,w,h);
    else if (this.state===GameState.GAME_OVER) { this.renderGame(ctx,w,h); this.renderGameOver(ctx,w,h); }
    ctx.restore();
  }

  renderMenu(ctx,w,h) {
    // BG gradient
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#0d0d2b'); g.addColorStop(1,'#1a1a3e');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

    // Stars
    ctx.fillStyle='rgba(255,255,255,0.3)';
    for(let i=0;i<60;i++) {
      const sx2=(i*137.508)%w, sy2=(i*97.3)%h;
      ctx.beginPath(); ctx.arc(sx2,sy2,1,0,TAU); ctx.fill();
    }

    // Title
    ctx.save();
    ctx.fillStyle='#ffdd00'; ctx.font='bold 46px Arial';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.shadowColor='#ff8800'; ctx.shadowBlur=20;
    ctx.fillText('⭐ BRAWL ARENA ⭐',w/2,30);
    ctx.shadowBlur=0; ctx.restore();

    if (this.menuState==='main') {
      ctx.fillStyle='#aaaacc'; ctx.font='18px Arial';
      ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText('Выбери бравлера и вступай в битву!', w/2, 100);

      const bx=w/2-110, by=h/2-35, bw=220, bh=70;
      const bg=ctx.createLinearGradient(bx,by,bx,by+bh);
      bg.addColorStop(0,'#00ee55'); bg.addColorStop(1,'#009933');
      ctx.fillStyle=bg;
      ctx.strokeStyle='#00ff66'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,12); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font='bold 28px Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=4;
      ctx.fillText('▶ ИГРАТЬ',w/2,h/2);
      ctx.shadowBlur=0;
      ctx.fillStyle='#666688'; ctx.font='12px Arial';
      const hint=IS_TOUCH
        ? 'Левый джойстик = движение  |  Правый = прицел и стрельба  |  Жёлтый = супер'
        : 'WASD = движение  |  Мышь = прицел и стрельба  |  Пробел = супер';
      ctx.fillText(hint,w/2,h-50);
      this.startBtnRect={x:bx,y:by,w:bw,h:bh};

    } else if (this.menuState==='select') {
      ctx.fillStyle='#ffdd00'; ctx.font='bold 24px Arial';
      ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText('ВЫБЕРИ БРАВЛЕРА',w/2,88);

      const cw=155, ch=210;
      const keys=['shelly','colt','bull','nita'];
      const startX=w/2-(4*cw+3*12)/2;
      const cy2=h/2-ch/2;
      this.brawlerCardRects=[];

      for(let i=0;i<keys.length;i++) {
        const key=keys[i], cfg=BRAWLER_CONFIGS[key];
        const cx2=startX+i*(cw+12);
        const hov=this.hoverBrawler===key;

        // Card
        ctx.save();
        if (hov) { ctx.shadowColor=cfg.color; ctx.shadowBlur=15; }
        ctx.fillStyle=hov?'#2a2a55':'#1e1e44';
        ctx.strokeStyle=hov?cfg.color:'#444466'; ctx.lineWidth=hov?3:2;
        ctx.beginPath(); ctx.roundRect(cx2,cy2,cw,ch,10); ctx.fill(); ctx.stroke();
        ctx.restore();

        // Avatar circle
        const g2=ctx.createRadialGradient(cx2+cw/2,cy2+52,0,cx2+cw/2,cy2+52,32);
        g2.addColorStop(0, cfg.color); g2.addColorStop(1, darken(cfg.color,0.6));
        ctx.fillStyle=g2;
        ctx.beginPath(); ctx.arc(cx2+cw/2,cy2+52,30,0,TAU); ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font='bold 22px Arial';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(cfg.symbol,cx2+cw/2,cy2+52);

        // Name
        ctx.fillStyle='#fff'; ctx.font='bold 15px Arial';
        ctx.fillText(cfg.name,cx2+cw/2,cy2+100);

        // Stats
        ctx.fillStyle='#9999bb'; ctx.font='11px Arial'; ctx.textAlign='left';
        const stats=[
          ['❤️ HP',  cfg.hp],
          ['💥 Урон', cfg.damage],
          ['📏 Даль', cfg.range],
          ['💨 Скор', cfg.speed],
        ];
        stats.forEach((s,j)=>{
          ctx.fillStyle='#7777aa';
          ctx.fillText(s[0],cx2+12,cy2+122+j*16);
          ctx.fillStyle='#eeeeff'; ctx.textAlign='right';
          ctx.fillText(s[1],cx2+cw-10,cy2+122+j*16);
          ctx.textAlign='left';
        });

        // Super label
        const superLabels={shelly:'🔥 Широкий залп',colt:'⚡ Очередь',bull:'💨 Рывок',nita:'🐻 Медведь'};
        ctx.fillStyle='#ffdd00'; ctx.font='10px Arial';
        ctx.textAlign='center';
        ctx.fillText(superLabels[key],cx2+cw/2,cy2+ch-12);

        this.brawlerCardRects.push({x:cx2,y:cy2,w:cw,h:ch,key});
      }
    }
  }

  renderGame(ctx,w,h) {
    ctx.fillStyle='#7ec850'; ctx.fillRect(0,0,w,h);
    ctx.save();
    ctx.translate(-this.camera.x,-this.camera.y);

    // Visible tile window
    const tx0=Math.max(0,Math.floor(this.camera.x/TILE));
    const ty0=Math.max(0,Math.floor(this.camera.y/TILE));
    const tx1=Math.min(MAP_COLS-1,Math.floor((this.camera.x+w)/TILE));
    const ty1=Math.min(MAP_ROWS-1,Math.floor((this.camera.y+h)/TILE));

    // Checkerboard ground
    ctx.fillStyle='rgba(0,0,0,0.03)';
    for (let ty=ty0;ty<=ty1;ty++)
      for (let tx=tx0;tx<=tx1;tx++)
        if ((tx+ty)%2===0) ctx.fillRect(tx*TILE,ty*TILE,TILE,TILE);

    // Tiles
    for (let ty=ty0;ty<=ty1;ty++) {
      for (let tx=tx0;tx<=tx1;tx++) {
        const t=tileMap.tileAt(tx,ty);
        if (t===T_EMPTY) continue;
        const x=tx*TILE, y=ty*TILE;
        if (t===T_WALL) {
          ctx.fillStyle='#9a9aa8'; ctx.fillRect(x,y+8,TILE,TILE-8);
          ctx.fillStyle='#c2c2d0'; ctx.fillRect(x,y,TILE,TILE-12);
          ctx.strokeStyle='#6e6e80'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,TILE-2,TILE-2);
        } else if (t===T_BOX||t===T_CRATE) {
          ctx.fillStyle='#8b7355'; ctx.fillRect(x+4,y+4,TILE-8,TILE-8);
          ctx.strokeStyle='#6b5a3e'; ctx.lineWidth=3; ctx.strokeRect(x+4,y+4,TILE-8,TILE-8);
          ctx.strokeStyle='#7a6548'; ctx.lineWidth=2;
          ctx.beginPath();
          ctx.moveTo(x+9,y+9); ctx.lineTo(x+TILE-9,y+TILE-9);
          ctx.moveTo(x+TILE-9,y+9); ctx.lineTo(x+9,y+TILE-9);
          ctx.stroke();
          if (t===T_CRATE) {
            ctx.fillStyle='#bb44ff';
            ctx.save(); ctx.translate(x+TILE/2,y+TILE/2); ctx.rotate(Math.PI/4);
            ctx.fillRect(-8,-8,16,16); ctx.restore();
          }
          const r=tileMap.boxHpRatio(tx,ty);
          if (r<1) {
            ctx.fillStyle='#333'; ctx.fillRect(x+10,y-4,TILE-20,5);
            ctx.fillStyle=r>0.5?'#00ff00':'#ffaa00';
            ctx.fillRect(x+10,y-4,(TILE-20)*Math.max(r,0),5);
          }
        } else if (t===T_BUSH) {
          ctx.fillStyle='#3a8c2a'; ctx.fillRect(x,y,TILE,TILE);
          ctx.fillStyle='#4aaa35';
          for (let i=0;i<4;i++) {
            // deterministic leaf placement (no flicker)
            const lx=x+((tx*7+ty*13+i*29)%60)+10;
            const ly=y+((tx*17+ty*5+i*41)%60)+10;
            ctx.beginPath(); ctx.arc(lx,ly,7,0,TAU); ctx.fill();
          }
        } else if (t===T_WATER) {
          ctx.fillStyle='#3d9fd6'; ctx.fillRect(x,y,TILE,TILE);
          ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2;
          const wob=Math.sin(this.frameCount*0.05+tx+ty)*3;
          ctx.beginPath();
          ctx.moveTo(x+12,y+TILE/2+wob);
          ctx.quadraticCurveTo(x+TILE/2,y+TILE/2-6+wob,x+TILE-12,y+TILE/2+wob);
          ctx.stroke();
        }
      }
    }

    // Arena border
    ctx.strokeStyle='#4a8620'; ctx.lineWidth=10;
    ctx.strokeRect(0,0,ARENA_WIDTH,ARENA_HEIGHT);

    // Poison cloud
    this.poison.render(ctx);

    // Touch aim indicator (drawn under entities)
    this.renderTouchAim(ctx);

    for (const c of this.cubes)     c.render(ctx);
    for (const b of this.bears)     b.render(ctx,0,0);
    for (const p of this.particles) p.render(ctx,0,0);
    for (const b of this.bullets)   b.render(ctx,0,0);
    // Bush stealth: hidden enemies aren't drawn (dead player = spectator sees all)
    const spectator=!this.player||!this.player.alive;
    for (const b of this.brawlers) {
      if (!b.alive) continue;
      if (!b.isPlayer&&!spectator&&!canSee(this.player,b)) continue;
      const alpha=b.inBush?(b.isPlayer?0.55:0.75):1;
      b.render(ctx,0,0,alpha);
      if (b.isPlayer&&b.alive) {
        ctx.save();
        ctx.fillStyle='#00ffff'; ctx.font='bold 11px Arial';
        ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.shadowColor='#000'; ctx.shadowBlur=3;
        ctx.fillText('YOU',b.x,b.y-b.radius-18);
        ctx.restore();
      }
    }
    ctx.restore();

    // Poison shrink warning banner
    if (this.poison.warnTimer>0&&this.state===GameState.PLAYING) {
      ctx.save();
      ctx.fillStyle='rgba(40,90,30,0.85)';
      ctx.beginPath(); ctx.roundRect(w/2-130,46,260,28,8); ctx.fill();
      ctx.fillStyle='#aaffaa'; ctx.font='bold 15px Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('☠ Ядовитое облако сужается!',w/2,60);
      ctx.restore();
    }

    this.renderHUD(ctx,w,h);
  }

  // Aim guide while dragging the attack / super stick (world space)
  renderTouchAim(ctx) {
    const p=this.player;
    if (!p||!p.alive||!this.touchAimMode) return;
    const stick=this.touchAimMode==='super'?this.superStick:this.attackStick;
    if (!stick.active||stick.magnitude<0.2) return;
    const isSuper=this.touchAimMode==='super';
    const range=p.config.range*(isSuper?1.3:1);
    const ex=p.x+Math.cos(p.angle)*range;
    const ey=p.y+Math.sin(p.angle)*range;
    ctx.save();
    ctx.strokeStyle=isSuper?'#ffdd00':'#ffffff';
    ctx.lineWidth=isSuper?4:3;
    ctx.globalAlpha=0.55;
    ctx.setLineDash([10,8]);
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.setLineDash([]);
    // End marker
    ctx.fillStyle=isSuper?'#ffdd00':'#ffffff';
    ctx.globalAlpha=0.4;
    ctx.beginPath(); ctx.arc(ex,ey,isSuper?14:9,0,TAU); ctx.fill();
    // Spread cone for spread weapons
    const spread=isSuper?(p.config.superSpread||0):(p.config.spread||0);
    if (spread>0) {
      ctx.globalAlpha=0.18;
      ctx.fillStyle=isSuper?'#ffdd00':'#ffffff';
      ctx.beginPath();
      ctx.moveTo(p.x,p.y);
      ctx.arc(p.x,p.y,range,p.angle-spread/2,p.angle+spread/2);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  renderHUD(ctx,w,h) {
    const p=this.player; if(!p) return;

    // Minimap
    const mmX=10,mmY=10,mmW=130,mmH=97;
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.roundRect(mmX,mmY,mmW,mmH,5); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1; ctx.stroke();
    ctx.strokeStyle='rgba(126,200,80,0.5)'; ctx.strokeRect(mmX+2,mmY+2,mmW-4,mmH-4);
    // Tile layer cached offscreen, rebuilt when boxes break
    if (!this.mmCanvas||this.mmVersion!==tileMap.version) {
      this.mmCanvas=document.createElement('canvas');
      this.mmCanvas.width=mmW-4; this.mmCanvas.height=mmH-4;
      const mc=this.mmCanvas.getContext('2d');
      const tw=(mmW-4)/MAP_COLS, th=(mmH-4)/MAP_ROWS;
      const TILE_COLORS={
        [T_WALL]:'rgba(150,150,165,0.85)',
        [T_BOX]:'rgba(139,115,85,0.85)',
        [T_CRATE]:'rgba(187,68,255,0.85)',
        [T_BUSH]:'rgba(58,140,42,0.7)',
        [T_WATER]:'rgba(61,159,214,0.7)',
      };
      for (let ty=0;ty<MAP_ROWS;ty++)
        for (let tx=0;tx<MAP_COLS;tx++) {
          const c=TILE_COLORS[tileMap.tileAt(tx,ty)];
          if (!c) continue;
          mc.fillStyle=c;
          mc.fillRect(tx*tw,ty*th,Math.max(tw,1.5),Math.max(th,1.5));
        }
      this.mmVersion=tileMap.version;
    }
    ctx.drawImage(this.mmCanvas,mmX+2,mmY+2);
    // Poison zone frame
    const pb=this.poison.bounds();
    ctx.strokeStyle='rgba(120,255,80,0.8)'; ctx.lineWidth=1;
    ctx.strokeRect(
      mmX+(pb.x0/ARENA_WIDTH)*(mmW-4)+2, mmY+(pb.y0/ARENA_HEIGHT)*(mmH-4)+2,
      ((pb.x1-pb.x0)/ARENA_WIDTH)*(mmW-4), ((pb.y1-pb.y0)/ARENA_HEIGHT)*(mmH-4));
    // Cubes
    ctx.fillStyle='#bb44ff';
    for (const c of this.cubes) {
      ctx.fillRect(mmX+(c.x/ARENA_WIDTH)*(mmW-4)+1, mmY+(c.y/ARENA_HEIGHT)*(mmH-4)+1, 3, 3);
    }
    // Brawlers (hidden bush enemies don't show)
    const mmSpectator=!p.alive;
    for (const b of this.brawlers) {
      if (!b.alive) continue;
      if (!b.isPlayer&&!mmSpectator&&!canSee(p,b)) continue;
      ctx.fillStyle=b.isPlayer?'#00ffff':'#ff4444';
      ctx.beginPath();
      ctx.arc(mmX+(b.x/ARENA_WIDTH)*(mmW-4)+2, mmY+(b.y/ARENA_HEIGHT)*(mmH-4)+2,
              b.isPlayer?3:2.5, 0, TAU);
      ctx.fill();
    }
    for (const bear of this.bears) {
      ctx.fillStyle='#d2691e';
      ctx.beginPath();
      ctx.arc(mmX+(bear.x/ARENA_WIDTH)*(mmW-4)+2, mmY+(bear.y/ARENA_HEIGHT)*(mmH-4)+2, 2, 0, TAU);
      ctx.fill();
    }
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1;
    const vpX=mmX+(this.camera.x/ARENA_WIDTH)*(mmW-4)+2;
    const vpY=mmY+(this.camera.y/ARENA_HEIGHT)*(mmH-4)+2;
    ctx.strokeRect(vpX,vpY,(w/ARENA_WIDTH)*(mmW-4),(h/ARENA_HEIGHT)*(mmH-4));

    // Timer
    const min=Math.floor(this.matchTimerDisplay/60);
    const sec=this.matchTimerDisplay%60;
    const tim=`${min}:${sec.toString().padStart(2,'0')}`;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.65)';
    ctx.beginPath(); ctx.roundRect(w/2-42,8,84,30,6); ctx.fill();
    ctx.fillStyle=this.matchTimerDisplay<=30?'#ff4444':'#fff';
    ctx.font='bold 20px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(tim,w/2,23); ctx.restore();

    // Alive count + player cubes
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.65)';
    ctx.beginPath(); ctx.roundRect(w-112,8,102,30,6); ctx.fill();
    ctx.fillStyle='#ffdd00'; ctx.font='bold 15px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(`👥${this.aliveCount}  🧊${p.cubes}  ☠${p.kills}`,w-61,23); ctx.restore();

    // Bottom HUD (compact on touch so joysticks stay clear)
    const hudW=IS_TOUCH?240:310;
    const hudH=IS_TOUCH?34:52;
    const hudY=h-hudH-6, hudX=w/2-hudW/2;
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.beginPath(); ctx.roundRect(hudX,hudY,hudW,hudH,10); ctx.fill();

    // HP bar
    const hpW=hudW-20, hpH=14, hpX=hudX+10, hpY=hudY+8;
    const hpR=Math.max(0,p.hp/p.maxHp);
    ctx.fillStyle='#222';
    ctx.beginPath(); ctx.roundRect(hpX,hpY,hpW,hpH,4); ctx.fill();
    const hpG=ctx.createLinearGradient(hpX,hpY,hpX+hpW,hpY);
    if(hpR>0.6) { hpG.addColorStop(0,'#00cc44'); hpG.addColorStop(1,'#00ff66'); }
    else if(hpR>0.3) { hpG.addColorStop(0,'#ff8800'); hpG.addColorStop(1,'#ffcc00'); }
    else { hpG.addColorStop(0,'#cc0000'); hpG.addColorStop(1,'#ff3333'); }
    ctx.fillStyle=hpG;
    ctx.beginPath(); ctx.roundRect(hpX,hpY,hpW*hpR,hpH,4); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 10px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(`${Math.ceil(p.hp)} / ${p.maxHp}`,hudX+hudW/2,hpY+hpH/2);

    if (!IS_TOUCH) {
      // Ammo dots
      const amY=hudY+32;
      for(let i=0;i<3;i++) {
        const ax=hudX+55+i*28;
        if(i<p.ammo) {
          ctx.fillStyle='#00ccff';
          ctx.shadowColor='#00ccff'; ctx.shadowBlur=8;
          ctx.beginPath(); ctx.arc(ax,amY,7,0,TAU); ctx.fill();
          ctx.shadowBlur=0;
        } else {
          ctx.strokeStyle='#444'; ctx.lineWidth=2;
          ctx.beginPath(); ctx.arc(ax,amY,7,0,TAU); ctx.stroke();
        }
      }
      ctx.fillStyle='#888'; ctx.font='10px Arial'; ctx.textAlign='left';
      ctx.fillText('AMMO',hudX+12,amY+3);

      // Super bar
      const supX=hudX+150, supW=hudW-165, supH=12;
      const supR=p.superCharge/p.maxSuperCharge;
      ctx.fillStyle='#222';
      ctx.beginPath(); ctx.roundRect(supX,amY-6,supW,supH,4); ctx.fill();
      if(supR>=1) { ctx.fillStyle='#ffdd00'; ctx.shadowColor='#ffdd00'; ctx.shadowBlur=10; }
      else ctx.fillStyle='#8866cc';
      ctx.beginPath(); ctx.roundRect(supX,amY-6,supW*Math.min(supR,1),supH,4); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle=supR>=1?'#ffdd00':'#aaa'; ctx.font='bold 10px Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(supR>=1?'⚡ SUPER READY!':'SUPER',supX+supW/2,amY);
    }

    // Leaderboard: alive first (with cubes), then eliminated by placement
    const lbX=w-112,lbY=46;
    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.roundRect(lbX,lbY,102,20+TOTAL_PLAYERS*15,6); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 11px Arial'; ctx.textAlign='center';
    ctx.fillText('SHOWDOWN',lbX+51,lbY+13);
    const sorted=[...this.brawlers].sort((a,b)=>
      (a.placement??0)-(b.placement??0) || b.cubes-a.cubes || b.kills-a.kills);
    sorted.forEach((b,i)=>{
      const ry=lbY+28+i*15;
      ctx.font='10px Arial'; ctx.textAlign='left';
      if (b.alive) {
        ctx.fillStyle=b.isPlayer?'#00ffff':'#eee';
        ctx.fillText(`${b.config.name}`,lbX+8,ry);
        ctx.textAlign='right';
        ctx.fillText(`🧊${b.cubes}`,lbX+94,ry);
      } else {
        ctx.fillStyle=b.isPlayer?'rgba(0,255,255,0.45)':'#777';
        ctx.fillText(`✖ ${b.config.name}`,lbX+8,ry);
        ctx.textAlign='right';
        ctx.fillText(`#${b.placement}`,lbX+94,ry);
      }
    });

    if (IS_TOUCH) {
      this.renderJoysticks(ctx);
    } else {
      // Controls hint (desktop only)
      ctx.fillStyle='rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.roundRect(8,h-26,200,18,4); ctx.fill();
      ctx.fillStyle='#888'; ctx.font='10px Arial'; ctx.textAlign='left';
      ctx.fillText('WASD=Движение | Мышь=Стрельба | Пробел=Супер',14,h-15);
    }
  }

  // ── JOYSTICK UI (Brawl Stars style) ──────────────────────
  renderJoysticks(ctx) {
    const p=this.player; if(!p) return;

    // ── Move stick (left) ──
    const ms=this.moveStick;
    ctx.save();
    ms.renderBase(ctx);
    ctx.fillStyle=ms.active?'rgba(255,255,255,0.85)':'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(ms.knobX,ms.knobY,ms.knobRadius,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(ms.knobX,ms.knobY,ms.knobRadius,0,TAU); ctx.stroke();
    // Direction arrows on the base
    ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.font='bold 13px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('▲',ms.baseX,ms.baseY-ms.baseRadius+12);
    ctx.fillText('▼',ms.baseX,ms.baseY+ms.baseRadius-12);
    ctx.fillText('◀',ms.baseX-ms.baseRadius+12,ms.baseY);
    ctx.fillText('▶',ms.baseX+ms.baseRadius-12,ms.baseY);
    ctx.restore();

    // ── Attack stick (right) ──
    const as=this.attackStick;
    ctx.save();
    as.renderBase(ctx,'rgba(255,80,80,0.55)');
    // Ammo segments around the top of the base
    const segSpan=Math.PI*0.32, gap=0.10;
    const segStart=-Math.PI/2-(1.5*segSpan+gap);
    for(let i=0;i<3;i++) {
      const a0=segStart+i*(segSpan+gap), a1=a0+segSpan;
      ctx.strokeStyle=i<p.ammo?'#ffaa00':'rgba(255,255,255,0.15)';
      ctx.lineWidth=6;
      if(i<p.ammo){ ctx.shadowColor='#ffaa00'; ctx.shadowBlur=6; } else ctx.shadowBlur=0;
      ctx.beginPath(); ctx.arc(as.baseX,as.baseY,as.baseRadius+8,a0,a1); ctx.stroke();
    }
    ctx.shadowBlur=0;
    // Knob
    const ag=ctx.createRadialGradient(as.knobX,as.knobY,4,as.knobX,as.knobY,as.knobRadius);
    ag.addColorStop(0,'#ff6655'); ag.addColorStop(1,'#cc2211');
    ctx.fillStyle=as.active?ag:'rgba(220,60,40,0.8)';
    ctx.beginPath(); ctx.arc(as.knobX,as.knobY,as.knobRadius,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2; ctx.stroke();
    // Crosshair icon
    ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(as.knobX,as.knobY,9,0,TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(as.knobX-13,as.knobY); ctx.lineTo(as.knobX-5,as.knobY);
    ctx.moveTo(as.knobX+5,as.knobY);  ctx.lineTo(as.knobX+13,as.knobY);
    ctx.moveTo(as.knobX,as.knobY-13); ctx.lineTo(as.knobX,as.knobY-5);
    ctx.moveTo(as.knobX,as.knobY+5);  ctx.lineTo(as.knobX,as.knobY+13);
    ctx.stroke();
    ctx.restore();

    // ── Super stick (yellow, above attack) ──
    const ss=this.superStick;
    const charged=p.superCharge>=p.maxSuperCharge;
    const supR=p.superCharge/p.maxSuperCharge;
    ctx.save();
    if (charged) {
      const pulse=0.5+0.5*Math.sin(this.frameCount*0.15);
      ctx.shadowColor='#ffdd00'; ctx.shadowBlur=10+10*pulse;
      ctx.fillStyle='rgba(40,30,0,0.45)';
      ctx.beginPath(); ctx.arc(ss.baseX,ss.baseY,ss.baseRadius,0,TAU); ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle='#ffdd00'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(ss.baseX,ss.baseY,ss.baseRadius,0,TAU); ctx.stroke();
      // Knob
      const sg=ctx.createRadialGradient(ss.knobX,ss.knobY,3,ss.knobX,ss.knobY,ss.knobRadius);
      sg.addColorStop(0,'#fff4aa'); sg.addColorStop(1,'#ffcc00');
      ctx.fillStyle=sg;
      ctx.beginPath(); ctx.arc(ss.knobX,ss.knobY,ss.knobRadius,0,TAU); ctx.fill();
      ctx.strokeStyle='#aa8800'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='#553300'; ctx.font='bold 20px Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('⚡',ss.knobX,ss.knobY+1);
    } else {
      // Greyed out with charge progress ring
      ctx.fillStyle='rgba(0,0,0,0.28)';
      ctx.beginPath(); ctx.arc(ss.baseX,ss.baseY,ss.baseRadius,0,TAU); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(ss.baseX,ss.baseY,ss.baseRadius,0,TAU); ctx.stroke();
      ctx.strokeStyle='#ffdd00'; ctx.lineWidth=4;
      ctx.beginPath();
      ctx.arc(ss.baseX,ss.baseY,ss.baseRadius,-Math.PI/2,-Math.PI/2+TAU*supR);
      ctx.stroke();
      ctx.fillStyle='rgba(120,120,120,0.6)';
      ctx.beginPath(); ctx.arc(ss.baseX,ss.baseY,ss.knobRadius,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.font='bold 18px Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('⚡',ss.baseX,ss.baseY+1);
      ctx.fillStyle='rgba(255,221,0,0.8)'; ctx.font='bold 9px Arial';
      ctx.fillText(`${Math.floor(supR*100)}%`,ss.baseX,ss.baseY+ss.baseRadius+11);
    }
    ctx.restore();
  }

  renderGameOver(ctx,w,h) {
    ctx.fillStyle='rgba(0,0,0,0.78)'; ctx.fillRect(0,0,w,h);
    const place=this.player?this.player.placement:null;
    const won=place===1;
    ctx.fillStyle=won?'#ffdd00':'#ff8866';
    ctx.font='bold 40px Arial';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.shadowColor=won?'#ff8800':'#aa2200'; ctx.shadowBlur=20;
    ctx.fillText(won?'🏆 ПОБЕДА!':`ВЫ ВЫБЫЛИ — ${place} МЕСТО`,w/2,h/2-200);
    ctx.shadowBlur=0;
    const sorted=[...this.brawlers].sort((a,b)=>(a.placement||99)-(b.placement||99));
    sorted.forEach((b,i)=>{
      const ry=h/2-138+i*26;
      const medal=['🥇','🥈','🥉'][i]||`${b.placement}.`;
      ctx.fillStyle=b.isPlayer?'#00ffff':(['#ffd700','#c0c0c0','#cd7f32'][i]||'#aaa');
      ctx.font='bold 15px Arial'; ctx.textAlign='center';
      ctx.fillText(`${medal} ${b.config.name}${b.isPlayer?' (ВЫ)':''} — 🧊${b.cubes}  ☠${b.kills}`,w/2,ry);
    });
    const bx=w/2-95, by=h/2+95, bw=190, bh=50;
    const bg=ctx.createLinearGradient(bx,by,bx,by+bh);
    bg.addColorStop(0,'#00ee55'); bg.addColorStop(1,'#009933');
    ctx.fillStyle=bg; ctx.strokeStyle='#00ff66'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 20px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🔄 ИГРАТЬ СНОВА',w/2,by+bh/2);
    this.playAgainBtn={x:bx,y:by,w:bw,h:bh};
  }

  handleMenuClick() {
    const mx=this.mouse.x, my=this.mouse.y;
    if (this.state===GameState.GAME_OVER) {
      if (this.playAgainBtn&&mx>=this.playAgainBtn.x&&mx<=this.playAgainBtn.x+this.playAgainBtn.w&&
          my>=this.playAgainBtn.y&&my<=this.playAgainBtn.y+this.playAgainBtn.h) {
        this.menuState='select'; this.state=GameState.MENU;
      }
      return;
    }
    if (this.menuState==='main') {
      if (this.startBtnRect&&mx>=this.startBtnRect.x&&mx<=this.startBtnRect.x+this.startBtnRect.w&&
          my>=this.startBtnRect.y&&my<=this.startBtnRect.y+this.startBtnRect.h)
        this.menuState='select';
    } else if (this.menuState==='select') {
      for (const c of this.brawlerCardRects) {
        if (mx>=c.x&&mx<=c.x+c.w&&my>=c.y&&my<=c.y+c.h) {
          this.startMatch(c.key); break;
        }
      }
    }
  }

  updateHover() {
    if (this.state!==GameState.MENU||this.menuState!=='select') return;
    const mx=this.mouse.x, my=this.mouse.y;
    this.hoverBrawler=null;
    for (const c of this.brawlerCardRects) {
      if (mx>=c.x&&mx<=c.x+c.w&&my>=c.y&&my<=c.y+c.h) { this.hoverBrawler=c.key; break; }
    }
  }
}

// colour helper
function darken(hex, f) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.floor(r*f)},${Math.floor(g*f)},${Math.floor(b*f)})`;
}

window.addEventListener('load', () => { game = new Game(); });
</script>
